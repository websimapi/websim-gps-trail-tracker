<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Trail Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="map"></div>
    
    <div class="status" id="status">
        Locating...
    </div>

    <div class="controls">
        <button class="btn btn-record" id="recordBtn">Start Recording</button>
        <button class="btn" id="cameraBtn" style="display: none;"><img src="camera-icon.png" alt="Camera" class="btn-icon"></button>
        <button class="btn btn-save" id="saveBtn" style="display: none;">Save Trail</button>
        <button class="btn btn-trails" id="trailsBtn">View Trails</button>
    </div>

    <!-- Save Trail Modal -->
    <div class="modal" id="saveModal">
        <div class="modal-content">
            <h3>Save Trail</h3>
            <div class="form-group">
                <label for="trailName">Trail Name:</label>
                <input type="text" id="trailName" placeholder="Enter trail name">
            </div>
            <div class="form-group">
                <label for="trailDescription">Description (optional):</label>
                <input type="text" id="trailDescription" placeholder="Enter description">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeSaveModal()">Cancel</button>
                <button class="btn btn-save" onclick="saveTrail()">Save</button>
            </div>
        </div>
    </div>

    <!-- View Trails Modal -->
    <div class="modal" id="trailsModal">
        <div class="modal-content">
            <h3>Saved Trails</h3>
            <div class="trails-list" id="trailsList"></div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeTrailsModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Camera Modal -->
    <div class="modal" id="cameraModal">
        <div class="modal-content camera-modal-content">
            <h3>Take Photo</h3>
            <video id="cameraFeed" autoplay playsinline></video>
            <canvas id="photoCanvas" style="display:none;"></canvas>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="cancelCameraBtn">Cancel</button>
                <button class="btn btn-record" id="capturePhotoBtn">Capture</button>
            </div>
        </div>
    </div>

    <!-- Photo View Modal -->
    <div class="modal" id="photoViewModal">
        <div class="modal-content photo-view-modal-content">
            <h3>Photo Preview</h3>
            <img id="photoDisplay" alt="Captured photo">
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="closePhotoViewBtn">Close</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Trail Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        .btn-record {
            background: #ff4757;
            color: white;
        }

        .btn-record.recording {
            background: #ff3838;
            animation: pulse 1.5s infinite;
        }

        .btn-save {
            background: #2ed573;
            color: white;
        }

        .btn-trails {
            background: #5352ed;
            color: white;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #2c2c2c;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            color: white;
        }

        .modal h3 {
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #1a1a1a;
            color: white;
            font-size: 16px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-cancel {
            background: #747d8c;
            color: white;
        }

        .trails-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .trail-item {
            background: #3a3a3a;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trail-info h4 {
            margin-bottom: 5px;
        }

        .trail-info small {
            color: #aaa;
        }

        .trail-actions {
            display: flex;
            gap: 5px;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            min-width: auto;
        }

        .status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="status" id="status">
        Locating...
    </div>

    <div class="controls">
        <button class="btn btn-record" id="recordBtn">Start Recording</button>
        <button class="btn btn-save" id="saveBtn" style="display: none;">Save Trail</button>
        <button class="btn btn-trails" id="trailsBtn">View Trails</button>
    </div>

    <!-- Save Trail Modal -->
    <div class="modal" id="saveModal">
        <div class="modal-content">
            <h3>Save Trail</h3>
            <div class="form-group">
                <label for="trailName">Trail Name:</label>
                <input type="text" id="trailName" placeholder="Enter trail name">
            </div>
            <div class="form-group">
                <label for="trailDescription">Description (optional):</label>
                <input type="text" id="trailDescription" placeholder="Enter description">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeSaveModal()">Cancel</button>
                <button class="btn btn-save" onclick="saveTrail()">Save</button>
            </div>
        </div>
    </div>

    <!-- View Trails Modal -->
    <div class="modal" id="trailsModal">
        <div class="modal-content">
            <h3>Saved Trails</h3>
            <div class="trails-list" id="trailsList"></div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeTrailsModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        class TrailTracker {
            constructor() {
                this.map = null;
                this.userMarker = null;
                this.currentTrail = [];
                this.currentTrailPolyline = null;
                this.isRecording = false;
                this.watchId = null;
                this.savedTrails = this.loadTrails();
                this.displayedTrails = new Map();
                
                this.initMap();
                this.setupEventListeners();
                this.startLocationTracking();
            }

            initMap() {
                this.map = L.map('map').setView([0, 0], 16);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: ' OpenStreetMap contributors'
                }).addTo(this.map);
            }

            setupEventListeners() {
                document.getElementById('recordBtn').addEventListener('click', () => this.toggleRecording());
                document.getElementById('saveBtn').addEventListener('click', () => this.showSaveModal());
                document.getElementById('trailsBtn').addEventListener('click', () => this.showTrailsModal());
            }

            startLocationTracking() {
                if (!navigator.geolocation) {
                    this.updateStatus('Geolocation not supported');
                    return;
                }

                this.watchId = navigator.geolocation.watchPosition(
                    (position) => this.handleLocationUpdate(position),
                    (error) => this.handleLocationError(error),
                    {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 1000
                    }
                );
            }

            handleLocationUpdate(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                // Update user marker
                if (!this.userMarker) {
                    this.userMarker = L.marker([lat, lng]).addTo(this.map);
                    this.map.setView([lat, lng], 16);
                } else {
                    this.userMarker.setLatLng([lat, lng]);
                }

                this.updateStatus(`Accuracy: ${Math.round(accuracy)}m`);

                // Add to current trail if recording
                if (this.isRecording) {
                    const point = {
                        lat,
                        lng,
                        timestamp: Date.now(),
                        accuracy
                    };
                    
                    this.currentTrail.push(point);
                    this.updateCurrentTrailDisplay();
                }
            }

            handleLocationError(error) {
                let message = 'Location error: ';
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        message += 'Permission denied';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        message += 'Position unavailable';
                        break;
                    case error.TIMEOUT:
                        message += 'Timeout';
                        break;
                    default:
                        message += 'Unknown error';
                        break;
                }
                this.updateStatus(message);
            }

            toggleRecording() {
                const btn = document.getElementById('recordBtn');
                const saveBtn = document.getElementById('saveBtn');

                if (!this.isRecording) {
                    this.startRecording();
                    btn.textContent = 'Stop Recording';
                    btn.classList.add('recording');
                    saveBtn.style.display = 'block';
                } else {
                    this.stopRecording();
                    btn.textContent = 'Start Recording';
                    btn.classList.remove('recording');
                }
            }

            startRecording() {
                this.isRecording = true;
                this.currentTrail = [];
                this.updateStatus('Recording trail...');
            }

            stopRecording() {
                this.isRecording = false;
                this.updateStatus(`Trail recorded: ${this.currentTrail.length} points`);
            }

            updateCurrentTrailDisplay() {
                if (this.currentTrailPolyline) {
                    this.map.removeLayer(this.currentTrailPolyline);
                }

                if (this.currentTrail.length > 1) {
                    const latlngs = this.currentTrail.map(point => [point.lat, point.lng]);
                    this.currentTrailPolyline = L.polyline(latlngs, {
                        color: '#ff4757',
                        weight: 4,
                        opacity: 0.8
                    }).addTo(this.map);
                }
            }

            showSaveModal() {
                if (this.currentTrail.length === 0) {
                    alert('No trail data to save');
                    return;
                }
                document.getElementById('saveModal').style.display = 'flex';
                document.getElementById('trailName').focus();
            }

            saveTrail() {
                const name = document.getElementById('trailName').value.trim();
                const description = document.getElementById('trailDescription').value.trim();

                if (!name) {
                    alert('Please enter a trail name');
                    return;
                }

                const trail = {
                    id: Date.now(),
                    name,
                    description,
                    points: this.currentTrail,
                    createdAt: new Date().toISOString(),
                    distance: this.calculateDistance(this.currentTrail)
                };

                this.savedTrails.push(trail);
                this.saveTrails();
                this.closeSaveModal();
                this.clearCurrentTrail();
                this.updateStatus(`Trail "${name}" saved!`);
            }

            calculateDistance(points) {
                if (points.length < 2) return 0;
                
                let distance = 0;
                for (let i = 1; i < points.length; i++) {
                    distance += this.getDistanceBetweenPoints(
                        points[i - 1].lat, points[i - 1].lng,
                        points[i].lat, points[i].lng
                    );
                }
                return distance;
            }

            getDistanceBetweenPoints(lat1, lng1, lat2, lng2) {
                const R = 6371e3; // Earth's radius in meters
                const φ1 = lat1 * Math.PI/180;
                const φ2 = lat2 * Math.PI/180;
                const Δφ = (lat2-lat1) * Math.PI/180;
                const Δλ = (lng2-lng1) * Math.PI/180;

                const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                        Math.cos(φ1) * Math.cos(φ2) *
                        Math.sin(Δλ/2) * Math.sin(Δλ/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

                return R * c;
            }

            clearCurrentTrail() {
                this.currentTrail = [];
                if (this.currentTrailPolyline) {
                    this.map.removeLayer(this.currentTrailPolyline);
                    this.currentTrailPolyline = null;
                }
                document.getElementById('saveBtn').style.display = 'none';
                document.getElementById('recordBtn').textContent = 'Start Recording';
                document.getElementById('recordBtn').classList.remove('recording');
                this.isRecording = false;
            }

            showTrailsModal() {
                this.renderTrailsList();
                document.getElementById('trailsModal').style.display = 'flex';
            }

            renderTrailsList() {
                const container = document.getElementById('trailsList');
                container.innerHTML = '';

                if (this.savedTrails.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #aaa;">No saved trails</p>';
                    return;
                }

                this.savedTrails.forEach(trail => {
                    const isDisplayed = this.displayedTrails.has(trail.id);
                    const item = document.createElement('div');
                    item.className = 'trail-item';
                    item.innerHTML = `
                        <div class="trail-info">
                            <h4>${trail.name}</h4>
                            <small>${new Date(trail.createdAt).toLocaleDateString()} • ${Math.round(trail.distance)}m • ${trail.points.length} points</small>
                            ${trail.description ? `<div style="margin-top: 5px; color: #ccc;">${trail.description}</div>` : ''}
                        </div>
                        <div class="trail-actions">
                            <button class="btn btn-small" style="background: ${isDisplayed ? '#ff9500' : '#5352ed'};" onclick="app.showTrail('${trail.id}')">${isDisplayed ? 'Hide' : 'Show'}</button>
                            <button class="btn btn-small" style="background: #ff4757;" onclick="app.deleteTrail('${trail.id}')">Delete</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }

            showTrail(trailId) {
                const trail = this.savedTrails.find(t => t.id == trailId);
                if (!trail) return;

                // Remove previously displayed trail if exists
                if (this.displayedTrails.has(trailId)) {
                    this.map.removeLayer(this.displayedTrails.get(trailId));
                    this.displayedTrails.delete(trailId);
                    this.renderTrailsList(); // Update button states
                    return;
                }

                // Display the trail
                const latlngs = trail.points.map(point => [point.lat, point.lng]);
                const polyline = L.polyline(latlngs, {
                    color: '#2ed573',
                    weight: 3,
                    opacity: 0.7
                }).addTo(this.map);

                this.displayedTrails.set(trailId, polyline);
                this.map.fitBounds(polyline.getBounds());
                this.renderTrailsList(); // Update button states
                this.closeTrailsModal();
            }

            deleteTrail(trailId) {
                if (confirm('Are you sure you want to delete this trail?')) {
                    this.savedTrails = this.savedTrails.filter(t => t.id != trailId);
                    this.saveTrails();
                    
                    // Remove from map if displayed
                    if (this.displayedTrails.has(trailId)) {
                        this.map.removeLayer(this.displayedTrails.get(trailId));
                        this.displayedTrails.delete(trailId);
                    }
                    
                    this.renderTrailsList();
                }
            }

            loadTrails() {
                const saved = localStorage.getItem('gpsTrails');
                return saved ? JSON.parse(saved) : [];
            }

            saveTrails() {
                localStorage.setItem('gpsTrails', JSON.stringify(this.savedTrails));
            }

            updateStatus(message) {
                document.getElementById('status').textContent = message;
            }

            closeSaveModal() {
                document.getElementById('saveModal').style.display = 'none';
                document.getElementById('trailName').value = '';
                document.getElementById('trailDescription').value = '';
            }

            closeTrailsModal() {
                document.getElementById('trailsModal').style.display = 'none';
            }
        }

        // Global functions for modal buttons
        function closeSaveModal() {
            app.closeSaveModal();
        }

        function closeTrailsModal() {
            app.closeTrailsModal();
        }

        function saveTrail() {
            app.saveTrail();
        }

        // Initialize the app
        const app = new TrailTracker();
    </script>

</body>
